name: Build Farmer iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14          # iOS builds need macOS + Xcode
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          brew install autoconf automake libtool pkg-config
          python -m pip install --upgrade pip
          pip install kivy-ios cython==0.29.36

      - name: Build Kivy + Python for iOS (slow, ~20-40 min)
        run: |
          toolchain build python3 kivy pillow
          toolchain pip install kivymd
          # If your app needs more packages, add them here, e.g.:
          # toolchain pip install requests

      - name: Create Xcode project from the app
        run: |
          # main.py must be in the repo root (or change $PWD to the folder that holds it)
          toolchain create FarmerCosting "$PWD"
          ls -la
          find . -maxdepth 3 -name "*.xcodeproj"

      - name: Build unsigned .app with xcodebuild
        run: |
          PROJ=$(find . -maxdepth 3 -name "*.xcodeproj" | head -1)
          SCHEME=$(basename "$PROJ" .xcodeproj)
          echo "Project: $PROJ  Scheme: $SCHEME"

          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ ! -d "$APP" ]; then
            echo "❌ No .app found!"
            exit 1
          fi
          echo "📦 App: $APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          cd ipa
          zip -qr ../farmer-costing-unsigned.ipa Payload
          cd ..
          ls -la farmer-costing-unsigned.ipa

      # ---------------------------------------------------------------
      # OPTIONAL: signed build (needs a paid Apple Developer account).
      # Add these repo secrets: IOS_CERT_P12 (base64), IOS_CERT_PASSWORD,
      # IOS_PROVISION_PROFILE (base64), IOS_TEAM_ID, then replace the
      # unsigned xcodebuild step above with a signed archive + export.
      # ---------------------------------------------------------------

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: farmer-costing-ios
          path: farmer-costing-unsigned.ipa
          retention-days: 14
