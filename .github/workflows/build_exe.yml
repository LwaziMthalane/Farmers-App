name: Build Kivy APK with Proper Signing

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: DEBUG - Show project structure
        run: |
          echo "=== Project root ==="
          ls -la
          echo ""
          echo "=== buildozer.spec ==="
          cat buildozer.spec
          echo ""
          echo "=== main.py present? ==="
          test -f main.py && echo "YES: main.py exists" || echo "NO: main.py MISSING"
          echo ""
          echo "=== Python files (depth 2) ==="
          find . -maxdepth 2 -name "*.py" -not -path "./.git/*"

      - name: Generate debug keystore if missing
        run: |
          if [ ! -f android/debug.keystore ]; then
            echo "🔐 Generating debug keystore..."
            mkdir -p android
            keytool -genkey -v \
              -keystore android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "🔐 Using existing keystore"
          fi
          md5sum android/debug.keystore

      - name: Build APK using Buildozer Action
        id: build
        continue-on-error: true
        uses: digreatbrian/buildozer-action@v2
        with:
          buildozer-cmd: buildozer -v android debug

      - name: DEBUG - Dump buildozer logs (ALWAYS runs)
        if: always()
        run: |
          echo "=== Buildozer outcome: ${{ steps.build.outcome }} ==="
          echo ""
          echo "=== bin/ ==="
          ls -la bin/ 2>/dev/null || echo "(no bin/)"
          echo ""
          echo "=== .buildozer log files ==="
          find .buildozer -type f -name "*.log" 2>/dev/null | head -20
          echo ""
          echo "=== TAIL of every log ==="
          find .buildozer -type f -name "*.log" -exec sh -c '
            echo "--------- {} ---------"
            tail -150 "{}"
          ' \; 2>/dev/null

      - name: PROPER SIGNING with apksigner
        if: success()
        run: |
          echo "📥 Installing Android SDK tools..."
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-*.zip
          mkdir -p android-sdk/cmdline-tools
          mv cmdline-tools android-sdk/cmdline-tools/latest

          export ANDROID_SDK_ROOT=$PWD/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin

          echo "📦 Installing build-tools..."
          yes | sdkmanager --install "build-tools;34.0.0" --sdk_root=$ANDROID_SDK_ROOT
          export PATH=$PATH:$ANDROID_SDK_ROOT/build-tools/34.0.0

          APK=$(find ./bin -name "*.apk" | head -1)
          if [ ! -f "$APK" ]; then
            echo "❌ No APK found!"
            exit 1
          fi

          echo "📦 APK: $(basename "$APK")"
          zip -d "$APK" "META-INF/*" 2>/dev/null || true

          echo "🔏 Signing..."
          apksigner sign \
            --ks android/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            "$APK"

          echo "✅ Signed with apksigner"

      - name: Check final APK
        if: always()
        run: |
          APK=$(find ./bin -name "*.apk" 2>/dev/null | head -1)
          if [ -f "$APK" ]; then
            echo "📱 Final APK: $(basename "$APK")"
            echo "📏 Size: $(wc -c < "$APK") bytes"
          else
            echo "❌ No APK produced"
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farmer-costing-apk
          path: ./bin/*.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Upload build logs (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            .buildozer/**/*.log
            .buildozer/android/platform/build-*/build.log
            .buildozer/android/platform/build-*/dists/*/build/outputs/logs/*
          retention-days: 7
          if-no-files-found: warn
