name: Build Farmer APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            automake build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv

      - name: Generate debug keystore (if missing)
        run: |
          mkdir -p android
          if [ ! -f android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Pre-seed buildozer caches so the second run is fast
      - name: Cache buildozer globals
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-global-

      - name: Cache buildozer project
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-project-${{ github.sha }}
          restore-keys: buildozer-project-

      - name: Build APK (full log captured)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee buildozer-full.log
          exit ${PIPESTATUS[0]}

      - name: Show build result + tail of log (ALWAYS)
        if: always()
        run: |
          echo "==============================================="
          echo " Buildozer outcome: ${{ steps.build.outcome }}"
          echo "==============================================="
          if [ -f buildozer-full.log ]; then
            echo ""
            echo "===== ERROR / TRACEBACK LINES ====="
            grep -n -iE "error|traceback|exception|fatal|failed|no such file|not found" \
              buildozer-full.log | tail -60 || echo "(no matches)"
            echo ""
            echo "===== LAST 250 LINES ====="
            tail -n 250 buildozer-full.log
          else
            echo "buildozer-full.log was never created!"
          fi
          echo ""
          echo "===== bin/ ====="
          ls -la bin/ 2>/dev/null || echo "(no bin directory)"
          echo ""
          echo "===== .buildozer/ (2 levels) ====="
          find .buildozer -maxdepth 2 -type d 2>/dev/null || echo "(no .buildozer)"

      - name: Upload APK (if built)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farmer-costing-apk
          path: bin/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload full build log (ALWAYS)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-full-log
          path: buildozer-full.log
          if-no-files-found: warn
          retention-days: 7
